<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mock Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2547; --navy2:#1b3a68; --bg:#eceff4; --paper:#fff; --ink:#1c2430; --soft:#5b6676; --faint:#98a2b1;
  --line:#d5dbe4; --line2:#e7ebf1; --blue:#1d5aa8; --blue-soft:#e7f0fb;
  --amber:#f5a623; --red:#e5484d; --green:#1f9d62; --green-soft:#e4f5ec; --red-soft:#fdeaea; --flag:#d92d20; --hl:#fff176;
  --qfs:17px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
#app{height:100%}

/* generic */
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){background:#f3f6fa;border-color:#b8c2d0}
.btn:disabled{opacity:.4;cursor:default}
a.btn{display:inline-block;text-decoration:none}
.page a{color:var(--blue)}
.page a.btn.primary{color:#fff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:#174c90;border-color:#174c90}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover:not(:disabled){background:#cc3a3f}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;color:var(--soft)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.muted{color:var(--soft)}

/* page shells (list / intro / break / results) */
.page{max-width:920px;margin:0 auto;padding:28px 16px 60px}
.page h1{font-size:26px;margin:0 0 4px;color:var(--navy)}
.page h2{font-size:18px;margin:28px 0 10px;color:var(--navy)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin:14px 0}
.mrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mrow h3{margin:0 0 2px;font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--line2);color:var(--soft);margin-right:6px}
.tag.live{background:var(--blue-soft);color:var(--blue)}
.tag.done{background:var(--green-soft);color:var(--green)}
.banner{background:#fff6e0;border:1px solid #f3d38a;color:#6b4a00;border-radius:8px;padding:10px 14px;margin:12px 0}
table.simple{border-collapse:collapse;width:100%}
table.simple th,table.simple td{padding:8px 10px;border-bottom:1px solid var(--line2);text-align:left}
table.simple th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
table.simple td.n,table.simple th.n{text-align:right;font-variant-numeric:tabular-nums}
ul.tips{margin:6px 0 0;padding-left:20px}
ul.tips li{margin:3px 0}
kbd{font:600 12px ui-monospace,Menlo,monospace;background:#f1f4f8;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

/* break */
.break{text-align:center;padding-top:64px}
.bigclock{font-size:64px;font-weight:700;letter-spacing:.02em;color:var(--navy);font-variant-numeric:tabular-nums;margin:12px 0}
.bigclock.low{color:var(--red)}

/* exam shell: Prometric CFA exam look (matches the official tutorial) */
body.inexam{background:#dfe7eb}
.exam{height:100%;display:flex;flex-direction:column;position:relative;background:#fff;font-family:"Open Sans","Source Sans Pro",Arial,sans-serif;color:#333;overflow:hidden}
.xh{background:#4d4c4d;color:#fff;height:57px;flex:0 0 57px;display:flex;align-items:center;padding:0 13px;gap:12px;font-size:15px;line-height:19px}
.xh b{font-weight:700}
.xh .xl{flex:1 1 0;min-width:0;white-space:nowrap}
.xh .xclk{display:flex;align-items:center;gap:7px;background:none;border:0;color:#fff;padding:2px 4px;text-align:left;font-size:16px;line-height:19px;position:relative}
.xh .xclk svg{width:28px;height:28px;flex:0 0 28px}
.xh .xclk .tv{font-variant-numeric:tabular-nums}
.xh .xr{flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;gap:28px}
.xprog{width:120px;text-align:center;font-size:12px;line-height:16px}
.xprog .trk{height:14px;background:#e9ecef;border-radius:7px;overflow:hidden;margin-bottom:3px}
.xprog .trk i{display:block;height:100%;background:#8cc63f;border-radius:7px}
.xfin{background:#fff8dc;color:#4d4c4d;border:0;border-radius:3px;font-weight:700;font-size:16px;width:165px;height:41px}
.xfin:hover{background:#fff2c2}
.talert{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff8dc;color:#4d4c4d;border:2px solid #c58b2b;border-radius:3px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap;z-index:20}
.xg{background:#8cc63f;color:#fff;height:25px;flex:0 0 25px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:15px;white-space:nowrap;overflow:hidden;gap:12px}
.xg span{overflow:hidden;text-overflow:ellipsis}
.xb{flex:1 1 auto;display:flex;min-height:0;padding:4px 4px 4px 0}
.xnav{flex:0 0 136px;overflow-y:auto;padding:4px 0 8px}
.nv{display:flex;align-items:center;justify-content:center;gap:5px;position:relative;width:108px;height:24px;margin:0 0 4px 16px;background:#8cc63f;color:#fff;font:400 12px "Open Sans",Arial,sans-serif;border:0;border-radius:3px;padding:0}
.nv:hover{filter:brightness(1.06)}
.nv.att{background:#4d4c4d}
.nv.att::before{content:"";position:absolute;left:0;top:0;border-top:11px solid #fff;border-right:11px solid #b9bfc3}
.nv.cur{width:118px;border-radius:3px 0 0 3px;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%)}
.nv svg{width:11px;height:11px;fill:#fff}
.xc{flex:1 1 auto;min-width:0;overflow:auto;border:1px solid #b5b5b5;border-radius:4px;padding:20px 20px 30px;background:var(--cbg,#fff);color:var(--cfg,#000);font:16px/1.43 Arial,Helvetica,sans-serif}
.xc .stem{background:var(--sbg,#f4f6f7);padding:12px 10px;margin:0 0 25px;overflow-x:auto}
.xc .stem p{margin:0 0 .7em}.xc .stem p:last-child{margin-bottom:0}
.xc .stem th,.xc .stem td{border:1px solid #9aa3a8;padding:5px 12px}
.xc .stem th{background:rgba(0,0,0,.05)}
.orow{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px}
.olet{flex:0 0 16px;color:var(--cfg,#333);padding-top:9px}
.obox{flex:1;min-width:0;border:3px solid #444;border-radius:2px;padding:10px 11px;min-height:48px;background:var(--cbg,#fff);color:var(--cfg,#000);cursor:pointer;outline:none}
.obox p{margin:0}
.obox:focus-visible{box-shadow:0 0 0 3px rgba(140,198,63,.6)}
.obox.sel{background:#fff8dc;border-color:#c58b2b;color:#000}
.orow.struck .olet,.orow.struck .obox{text-decoration:line-through}
mark.hl{background:#fff35c;color:#000;padding:0}
.xf{flex:0 0 56px;background:#4d4c4d;border-top:4px solid #8cc63f;display:flex;align-items:center;padding:0 7px 0 9px;gap:10px}
.xf .ic{background:none;border:0;padding:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.xf .ic svg{width:34px;height:34px;fill:#fff}
.xf .sp{flex:1}
.gb{background:#8cc63f;color:#fff;border:0;border-radius:3px;height:41px;padding:0 14px;font:700 16px "Open Sans",Arial,sans-serif;display:inline-flex;align-items:center;gap:7px}
.gb:hover:not(:disabled){filter:brightness(1.05)}
.gb:disabled{opacity:.55;cursor:default}
.gb svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gb.flagbtn{width:44px;padding:0;justify-content:center}
.gb.flagbtn svg{width:20px;height:20px;fill:#fff;stroke:none}
.gb.flagbtn.on{background:#6b9a2b;box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
/* side panels (section review, preferences) */
.xpanel{position:absolute;left:0;top:0;bottom:0;z-index:30;display:flex;flex-direction:column;background:#fff;box-shadow:3px 0 10px rgba(0,0,0,.25)}
.xpanel .ph{background:#4d4c4d;color:#fff;display:flex;align-items:center;gap:12px;padding:0 15px;height:57px;flex:0 0 57px;font-size:16px;font-weight:700}
.xpanel .ph .sp{flex:1}
.xpanel .ph button{background:none;border:0;color:#fff;padding:2px;display:flex}
.xpanel .ph svg{width:20px;height:20px;fill:#fff}
.xpanel .pfoot{flex:0 0 56px;background:#4d4c4d;border-top:4px solid #8cc63f}
.rv{width:372px}
.rv .flt{background:#ced8dd;padding:14px 17px 20px;position:relative;font-size:15px;font-weight:700;color:#3d505a}
.rv .flt label{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;cursor:pointer}
.rv .flt input{width:18px;height:18px;margin:0}
.rv .clr{position:absolute;right:20px;bottom:20px;background:#8cc63f;color:#fff;border:0;border-radius:3px;height:40px;padding:0 13px;font-size:17px}
.rv .clr:disabled{opacity:.55}
.rv .grid{flex:1;overflow-y:auto;padding:18px 10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:7px 12px}
.rv .grid .nv{margin:0;width:90px}
.rv .grid .nv.cur{width:100px}
.pf{width:320px;background:#ced8dd}
.pf .list{flex:1;overflow-y:auto;padding:14px 22px;display:flex;flex-direction:column;gap:12px}
.pf .sw{border:4px solid #fff;border-radius:2px;padding:14px 12px;text-align:left;font:14px Arial,sans-serif;min-height:64px}
.pf .sw.on{border-color:#000;box-shadow:0 0 0 3px #8cc63f}
.pf .pb{flex:0 0 84px;background:#a6b7c0;display:flex;align-items:center;justify-content:center;gap:16px}
.pf .pb button{background:#4d4c4d;color:#fff;border:0;border-radius:3px;width:108px;height:30px;font-size:14px}
/* confirm finish + help dialogs */
.cfback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.cf{background:#fff;width:100%;max-width:484px;border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-family:"Open Sans",Arial,sans-serif;overflow:hidden}
.cf .ch{background:#4d4c4d;color:#fff;font-weight:700;font-size:16px;padding:9px 12px}
.cf .cb{padding:26px 34px 22px;text-align:center;color:#4d4c4d;font-weight:700;font-size:15px}
.cf .cb > svg{width:64px;height:58px;display:block;margin:0 auto 18px}
.cf .cb p{margin:0 0 12px}
.cf .cb .btns{display:flex;justify-content:center;gap:14px;margin-top:26px}
.cf.help{max-width:640px}
.cf.help .cb{text-align:left;font-weight:400;font-size:14.5px;line-height:1.5;color:#333;max-height:70vh;overflow:auto}
.cf.help .cb h4{margin:14px 0 4px;font-size:15px}
.hlfloat{position:fixed;z-index:40;width:46px;height:46px;background:#8cc63f;border:2px solid #fff;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.hlfloat svg{width:26px;height:26px;fill:#fff}

/* modals */
.mback{position:fixed;inset:0;background:rgba(15,37,71,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:780px}
.modal h3{margin:0 0 8px;font-size:19px;color:var(--navy)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:14px 0 4px}
.nb{position:relative;height:44px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--soft)}
.nb:hover{border-color:var(--blue)}
.nb.ans{background:var(--navy2);border-color:var(--navy2);color:#fff}
.nb.cur{box-shadow:0 0 0 3px var(--amber)}
.nb.flag::after{content:"";position:absolute;top:-1px;right:-1px;width:0;height:0;border-style:solid;border-width:0 15px 15px 0;border-color:transparent var(--flag) transparent transparent;border-top-right-radius:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-2px;margin-right:5px;background:#fff}
.legend i.a{background:var(--navy2);border-color:var(--navy2)}
.legend i.f{background:var(--flag);border-color:var(--flag)}
.legend i.c{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.stem{overflow-x:auto;margin-bottom:18px}
.stem p{margin:0 0 .8em}
.stem table{border-collapse:collapse;margin:.6em 0 1em;max-width:100%}
.stem th,.stem td{border:1px solid var(--line);padding:5px 12px;text-align:left}
.stem th{background:#f3f6fa}
/* results */
.rtop{background:var(--navy);color:#fff}
.rtop .in{max-width:920px;margin:0 auto;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.rtop b{font-size:18px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.sc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sc .v{font-size:32px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.sc .v.good{color:var(--green)} .sc .v.bad{color:var(--red)}
.sc .l{font-size:12.5px;color:var(--soft)}
.bar{position:relative;height:12px;background:var(--line2);border-radius:6px;min-width:120px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--red)}
.bar i.ok{background:var(--green)}
.bar b{position:absolute;left:70%;top:-3px;bottom:-3px;width:2px;background:var(--navy)}
.qlist details{background:#fff;border:1px solid var(--line);border-radius:9px;margin:8px 0}
.qlist summary{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;flex-wrap:wrap;list-style:none}
.qlist summary::-webkit-details-marker{display:none}
.qlist summary::before{content:"\25B8";color:var(--faint)}
.qlist details[open] summary::before{content:"\25BE"}
.qlist .num{font-weight:700;min-width:46px}
.qlist .st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.st.ok{background:var(--green-soft);color:var(--green)} .st.no{background:var(--red-soft);color:var(--red)} .st.na{background:#fff0d6;color:#8a5a00}
.qlist .topic{font-size:13px;color:var(--soft);flex:1;min-width:140px}
.qlist .ans{font-size:13px;font-variant-numeric:tabular-nums}
.qlist .body{padding:2px 18px 16px;border-top:1px solid var(--line2);font-size:15.5px}
.qlist .body .stem{margin-top:12px}
.qlist .o{padding:7px 12px;border-radius:7px;margin:5px 0;border:1px solid var(--line2)}
.qlist .o.right{background:var(--green-soft);border-color:#a6dcc0}
.qlist .o.wrong{background:var(--red-soft);border-color:#f2b7b9}
.expl{background:#f7f9fc;border-left:4px solid var(--blue);padding:8px 14px;margin-top:12px;border-radius:0 6px 6px 0}
.expl p{margin:.4em 0}
textarea.code{width:100%;height:110px;font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:6px;padding:8px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3)}

@media (max-width:700px){
  .page{padding-top:18px}
  .bigclock{font-size:48px}
  .modal{padding:16px}
  .xh{gap:8px;font-size:13px;padding:0 8px}
  .xprog{display:none}
  .xfin{width:auto;padding:0 10px;font-size:14px}
  .xnav{flex-basis:70px}
  .nv{width:52px;margin-left:6px}.nv.cur{width:60px}
  .xc{padding:12px}
  .rv,.pf{width:min(372px,92vw)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';

const TOPICS = {
  ethics: 'Ethics', quant: 'Quantitative Methods', econ: 'Economics', fsa: 'Financial Statement Analysis',
  ci: 'Corporate Issuers', equity: 'Equity Investments', fi: 'Fixed Income', deriv: 'Derivatives',
  alts: 'Alternative Investments', pm: 'Portfolio Management'
};
const ZOOMS = [14, 15, 17, 19, 21, 24];
const PASS = 70;
const KEY = id => 'cfamock:v1:' + id;
const PREF_KEY = 'cfamock:prefs';

const root = document.getElementById('app');
const params = new URLSearchParams(location.search);
const ID = params.get('id');

let M = null;          // mock definition
let S = null;          // persisted state
let fatal = null;      // error message
let mockList = [];
let lastSave = 0;
let lastTick = Date.now();
let toastTimer = null;
let prefs = { zoom: 2, hideTimer: false };
const ui = { modal: null, filter: 'all', rfilter: 'all', scope: null, notice: null, expand: false,
  review: false, reviewLock: false, rv: { un: 0, att: 0, fl: 0 }, prefsOpen: false, schemeTmp: 0, clockMode: 'sec', al: {}, alertUntil: 0, alertText: '' };

try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {} }

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function clock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return pad(Math.floor(sec / 3600)) + ':' + pad(Math.floor(sec % 3600 / 60)) + ':' + pad(sec % 60);
}
function ms(sec) { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + pad(sec % 60); }
function pct(a, b) { return b ? Math.round(a / b * 1000) / 10 : 0; }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200);
}
function freshState(m) {
  return {
    v: 1, phase: 'start', si: 0,
    ses: m.sessions.map(() => ({ start: null, end: null, ended: null })),
    cur: m.sessions.map(() => 0), q: {}, breakEnd: null
  };
}
function loadState(id, m) {
  try {
    const raw = localStorage.getItem(KEY(id));
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.v === 1 && s.ses && s.ses.length === m.sessions.length) return s;
    }
  } catch (e) {}
  return freshState(m);
}
function save(force) {
  if (!S) return;
  const now = Date.now();
  if (!force && now - lastSave < 4000) return;
  lastSave = now;
  try { localStorage.setItem(KEY(ID), JSON.stringify(S)); } catch (e) {}
}
function qst(id) { return S.q[id] || (S.q[id] = { a: null, x: [], f: 0, h: {}, t: 0 }); }
function curQ() { return M.sessions[S.si].questions[S.cur[S.si]]; }
function sessLen(si) { return M.sessions[si].questions.length; }

/* ---------- phases ---------- */
function startSession(si, at) {
  const t = at || Date.now();
  S.si = si; S.phase = 'run';
  S.ses[si].start = t; S.ses[si].end = t + M.sessions[si].minutes * 60000;
  S.breakEnd = null;
  save(true);
}
function endSession(si, timedOut) {
  const now = Date.now(), s = S.ses[si];
  s.ended = Math.min(now, s.end);
  ui.modal = null;
  if (si + 1 < M.sessions.length) {
    S.phase = 'break'; S.si = si + 1; S.breakEnd = now + (M.breakMinutes || 30) * 60000;
  } else {
    S.phase = 'results';
  }
  ui.notice = timedOut ? M.sessions[si].name + ' ended automatically: time expired.' : null;
  save(true); render();
}
// resolve anything that should already have happened (timers that expired while the page was closed)
function advance() {
  for (let guard = 0; guard < 10; guard++) {
    const now = Date.now();
    if (S.phase === 'run' && now >= S.ses[S.si].end) {
      const si = S.si, end = S.ses[si].end;
      S.ses[si].ended = end;
      if (si + 1 < M.sessions.length) { S.phase = 'break'; S.si = si + 1; S.breakEnd = end + (M.breakMinutes || 30) * 60000; }
      else S.phase = 'results';
      ui.notice = M.sessions[si].name + ' ended automatically: time expired.';
      continue;
    }
    if (S.phase === 'break' && now >= S.breakEnd) {
      startSession(S.si, S.breakEnd);
      ui.notice = 'The break ran out, so ' + M.sessions[S.si].name + ' started automatically.';
      continue;
    }
    break;
  }
}

/* ---------- scoring ---------- */
function collect(scope) {
  const out = [];
  M.sessions.forEach((ses, si) => {
    if (scope !== 'all' && scope !== si) return;
    if (S.ses[si].ended == null) return;
    ses.questions.forEach((q, qi) => {
      const st = S.q[q.id] || {};
      out.push({
        si, qi, num: qi + 1, q, id: q.id, topic: q.topic, concept: q.concept || '',
        chosen: st.a || null, correct: q.answer, ok: st.a === q.answer,
        flagged: st.f ? 1 : 0, secs: Math.round(st.t || 0)
      });
    });
  });
  return out;
}
function resultsCode(scope) {
  const rows = collect(scope);
  const sess = M.sessions.map((s, si) => S.ses[si].ended != null ? { s: s.name, used: Math.round((S.ses[si].ended - S.ses[si].start) / 1000) } : null).filter(Boolean);
  return JSON.stringify({
    mock: M.id || ID, scope: scope === 'all' ? 'all' : M.sessions[scope].name, sessions: sess,
    q: rows.map(r => ({ id: r.id, topic: r.topic, concept: r.concept, chosen: r.chosen, correct: r.correct, flagged: r.flagged, secs: r.secs }))
  });
}

/* ---------- actions ---------- */
function pick(k) {
  const q = curQ(), st = qst(q.id);
  if (!(k in q.options)) return;
  st.a = st.a === k ? null : k;
  save(true); render();
}
function strike(k) {
  const q = curQ(), st = qst(q.id);
  if (!(k in q.options)) return;
  const i = st.x.indexOf(k);
  if (i >= 0) st.x.splice(i, 1);
  else st.x.push(k);
  save(true); render();
}
function flag() { const st = qst(curQ().id); st.f = st.f ? 0 : 1; save(true); render(); }
function go(i) {
  const n = sessLen(S.si);
  if (i < 0 || i >= n) return;
  S.cur[S.si] = i; ui.modal = null; save(true); render();
  const qa = document.getElementById('qarea'); if (qa) qa.scrollTop = 0;
}
function zoom(d) {
  prefs.zoom = Math.max(0, Math.min(ZOOMS.length - 1, prefs.zoom + d)); savePrefs();
  document.documentElement.style.setProperty('--qfs', ZOOMS[prefs.zoom] + 'px');
}

/* highlight: stored as [start,end) text offsets per container (stem / option letter) */
function mergeRanges(rs) {
  rs = rs.filter(r => r[1] > r[0]).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const r of rs) {
    const l = out[out.length - 1];
    if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else out.push([r[0], r[1]]);
  }
  return out;
}
function subtractRange(rs, a, b) {
  const out = [];
  for (const r of rs) {
    if (r[1] <= a || r[0] >= b) { out.push(r); continue; }
    if (r[0] < a) out.push([r[0], a]);
    if (r[1] > b) out.push([b, r[1]]);
  }
  return out;
}
function covered(rs, a, b) { return rs.some(r => r[0] <= a && r[1] >= b); }
function textOffset(cont, node, off) {
  const r = document.createRange(); r.setStart(cont, 0); r.setEnd(node, off); return r.toString().length;
}
function highlight() {
  const sel = window.getSelection();
  const qa = document.getElementById('qarea');
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed || !qa) { toast('Select some text first'); return; }
  const r = sel.getRangeAt(0);
  if (!qa.contains(r.commonAncestorContainer)) { toast('Select some text first'); return; }
  const st = qst(curQ().id);
  let any = false;
  qa.querySelectorAll('[data-hl]').forEach(c => {
    if (!r.intersectsNode(c)) return;
    const full = c.textContent.length;
    const a = c.contains(r.startContainer) ? textOffset(c, r.startContainer, r.startOffset) : 0;
    const b = c.contains(r.endContainer) ? textOffset(c, r.endContainer, r.endOffset) : full;
    if (b <= a) return;
    const k = c.dataset.hl, cur = st.h[k] || [];
    st.h[k] = covered(cur, a, b) ? mergeRanges(subtractRange(cur, a, b)) : mergeRanges(cur.concat([[a, b]]));
    if (!st.h[k].length) delete st.h[k];
    any = true;
  });
  sel.removeAllRanges();
  if (!any) { toast('Select some text first'); return; }
  save(true); render();
}
function clearHighlights() {
  const st = qst(curQ().id);
  if (!Object.keys(st.h).length) { toast('No highlights on this question'); return; }
  st.h = {}; save(true); render();
}
function applyHL(el, ranges) {
  if (!ranges || !ranges.length) return;
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; let pos = 0, n;
  while ((n = tw.nextNode())) { nodes.push({ n, s: pos, e: pos + n.data.length }); pos += n.data.length; }
  for (const t of nodes) {
    const segs = ranges.map(r => [Math.max(r[0], t.s) - t.s, Math.min(r[1], t.e) - t.s]).filter(x => x[1] > x[0]);
    for (let i = segs.length - 1; i >= 0; i--) {
      const rg = document.createRange(); rg.setStart(t.n, segs[i][0]); rg.setEnd(t.n, segs[i][1]);
      const m = document.createElement('mark'); m.className = 'hl'; rg.surroundContents(m);
    }
  }
}

function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  }
  return Promise.resolve(fallback());
}

/* ---------- views ---------- */
function view() {
  if (fatal) return 'error';
  if (!ID) return 'list';
  if (!M) return 'loading';
  if (ui.scope !== null) return 'results';
  return { start: 'intro', run: 'exam', break: 'break', results: 'results' }[S.phase];
}

function render() {
  const v = view();
  let html = '';
  if (v === 'error') html = rError();
  else if (v === 'loading') html = '<div class="page"><p class="muted">Loading...</p></div>';
  else if (v === 'list') html = rList();
  else if (v === 'intro') html = rIntro();
  else if (v === 'exam') html = rExam();
  else if (v === 'break') html = rBreak();
  else if (v === 'results') html = rResults();
  html += rModal(v);
  removeFloat();
  document.body.classList.toggle('inexam', v === 'exam');
  root.innerHTML = html;
  if (v === 'exam') {
    const q = curQ(), st = qst(q.id);
    document.title = M.title + ' - Q' + (S.cur[S.si] + 1);
    root.querySelectorAll('[data-hl]').forEach(c => applyHL(c, st.h[c.dataset.hl]));
    root.querySelectorAll('.xnav .nv.cur, .rv .grid .nv.cur').forEach(b => b.scrollIntoView({ block: 'nearest' }));
  } else document.title = M ? M.title : 'Mock Exam';
  updateTimer();
}

    return `<div class="cfback" data-act="mclose"><div class="cf" role="dialog" aria-modal="true"><div class="ch">Confirm Finish</div>
      <div class="cb">${IC.warn}${line ? `<p>${line}</p>` : ''}<p>Are you sure you would like to finish the test?</p>
      <div class="btns"><button class="gb" data-act="end-do">${IC.check} Finish</button><button class="gb" data-act="mclose">${IC.cross} Cancel</button></div></div></div></div>`;
  }
  if (m.type === 'help') {
    return `<div class="cfback" data-act="mclose"><div class="cf help" role="dialog" aria-modal="true"><div class="ch">Information</div><div class="cb">
      <h4>Navigating</h4>Use <b>Next</b> and <b>Back</b>, or the numbered buttons on the left. The current question has an arrow-shaped button, attempted questions are dark, unattempted stay green, and flagged ones show a flag.
      <h4>Time remaining</h4>Click the clock to switch between Section and Exam Time Remaining. Alerts appear below the clock at 30, 15 and 5 minutes.
      <h4>Answering</h4>Click an option to select it; click it again to unselect. Right-click an option to strike it out, and right-click again to remove the strikeout. You can still select a struck-out option.
      <h4>Flagging</h4>Click the flag button at the bottom to flag the question; click it again to remove the flag.
      <h4>Highlighting</h4>Drag over question text, then click the highlight button that appears. Click highlighted text and the button again to remove it. Answer options cannot be highlighted.
      <h4>Section Review</h4>The grid icon at the bottom left lists every question, with filters for unattempted, attempted and flagged. The padlock keeps the panel open.
      <h4>Magnification</h4>Ctrl and + or &minus; (&#8984; on a Mac), or Ctrl and the scroll wheel. The gear icon changes the colour scheme.
      <h4>Finishing</h4>Click <b>Finish Test</b> in the top right, then <b>Finish</b> to submit the section. You cannot return to a finished section. Unanswered questions score zero; there is no penalty for wrong answers.
      <div class="btns" style="justify-content:flex-end"><button class="gb" data-act="mclose">Close</button></div></div></div></div>`;
  }
  return '';
}

/* highlight button that appears after selecting question text (tutorial page 11) */
let hlFloatEl = null;
function removeFloat() { if (hlFloatEl) { hlFloatEl.remove(); hlFloatEl = null; } }
function showFloat(rect, onClick) {
  removeFloat();
  const b = document.createElement('button');
  b.className = 'hlfloat'; b.title = 'Highlight'; b.setAttribute('aria-label', 'Highlight'); b.innerHTML = IC.pen;
  const x = Math.min(window.innerWidth - 56, Math.max(8, rect.left + rect.width / 2 - 23));
  const y = Math.min(window.innerHeight - 56, rect.bottom + 6);
  b.style.left = x + 'px'; b.style.top = y + 'px';
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', e => { e.stopPropagation(); removeFloat(); onClick(); });
  document.body.appendChild(b); hlFloatEl = b;
}
function hlAfterMouseUp(e) {
  if (view() !== 'exam' || ui.modal) return;
  const stem = document.querySelector('.xc .stem[data-hl]');
  if (!stem) return;
  const sel = window.getSelection();
  if (sel && sel.rangeCount && !sel.isCollapsed && sel.toString().trim()) {
    const r = sel.getRangeAt(0);
    if (!stem.contains(r.startContainer) && !stem.contains(r.endContainer)) return;
    showFloat(r.getBoundingClientRect(), highlight);
    return;
  }
  const mk = e.target.closest && e.target.closest('mark.hl');
  if (mk && stem.contains(mk)) {
    const off = textOffset(stem, mk, 0);
    showFloat(mk.getBoundingClientRect(), () => {
      const st = qst(curQ().id);
      st.h.stem = (st.h.stem || []).filter(r => !(r[0] <= off && off < r[1]));
      if (!st.h.stem.length) delete st.h.stem;
      save(true); render();
    });
  }
}

function rResults() {
  const scope = ui.scope === null ? 'all' : ui.scope;
  const rows = collect(scope);
  const tot = rows.length, right = rows.filter(r => r.ok).length;
  const overall = pct(right, tot);
  const inBreak = S.phase === 'break' && ui.scope !== null;
  const sessCards = M.sessions.map((s, si) => {
    if (S.ses[si].ended == null || (scope !== 'all' && scope !== si)) return '';
    const rs = rows.filter(r => r.si === si), c = rs.filter(r => r.ok).length;
    const used = (S.ses[si].ended - S.ses[si].start) / 1000;
    return `<div class="sc"><div class="l">${esc(s.name)}</div><div class="v ${pct(c, rs.length) >= PASS ? 'good' : 'bad'}">${pct(c, rs.length)}%</div>
      <div class="l">${c} / ${rs.length} correct</div><div class="l">Time used ${clock(used)} of ${clock(s.minutes * 60)}</div></div>`;
  }).join('');
  const byTopic = {};
  rows.forEach(r => { const t = byTopic[r.topic] || (byTopic[r.topic] = { n: 0, c: 0 }); t.n++; if (r.ok) t.c++; });
  const order = Object.keys(TOPICS).concat(Object.keys(byTopic).filter(t => !(t in TOPICS)));
  const trows = order.filter(t => byTopic[t]).map(t => {
    const p = pct(byTopic[t].c, byTopic[t].n);
    return `<tr><td>${esc(TOPICS[t] || t)}</td><td class="n">${byTopic[t].c} / ${byTopic[t].n}</td><td class="n">${p}%</td>
      <td style="width:38%"><div class="bar"><i class="${p >= PASS ? 'ok' : ''}" style="width:${p}%"></i><b></b></div></td></tr>`;
  }).join('');
  const f = ui.rfilter;
  const list = rows.filter(r => f === 'all' || (f === 'wrong' && !r.ok) || (f === 'flag' && r.flagged));
  const nWrong = rows.filter(r => !r.ok).length, nFlag = rows.filter(r => r.flagged).length;
  const items = list.map(r => {
    const q = r.q;
    const opts = Object.keys(q.options).map(k => {
      const cls = k === r.correct ? 'right' : (k === r.chosen ? 'wrong' : '');
      const note = k === r.correct ? ' <b>(correct)</b>' : (k === r.chosen ? ' <b>(your answer)</b>' : '');
      return `<div class="o ${cls}"><b>${k}.</b> ${q.options[k]}${note}</div>`;
    }).join('');
    const stat = r.chosen == null ? '<span class="st na">Unanswered</span>' : (r.ok ? '<span class="st ok">Correct</span>' : '<span class="st no">Wrong</span>');
    return `<details${ui.expand ? ' open' : ''}><summary><span class="num">${scope === 'all' ? 'S' + (r.si + 1) + ' ' : ''}Q${r.num}</span>${stat}
      <span class="topic">${esc(TOPICS[r.topic] || r.topic)}${r.concept ? ' &middot; ' + esc(r.concept) : ''}</span>
      <span class="ans">You: <b>${r.chosen || '-'}</b> &nbsp; Correct: <b>${r.correct}</b>${r.flagged ? ' &nbsp; &#9873; flagged' : ''} &nbsp; ${ms(r.secs)}</span></summary>
      <div class="body"><div class="stem">${q.stem}</div>${opts}<div class="expl">${q.explanation || '<p class="muted">No explanation provided.</p>'}</div></div></details>`;
  }).join('');
  const time = rows.reduce((a, r) => a + r.secs, 0);
  return `<div class="rtop"><div class="in"><div><b>${esc(M.title)}</b> &middot; Results${scope === 'all' ? '' : ' &middot; ' + esc(M.sessions[scope].name)}</div>
      <div class="acts">${inBreak ? '<button class="btn sm" data-act="backbreak">Back to break</button>' : '<a class="btn sm" href="./">All mocks</a>'}</div></div></div>
    <div class="page" style="padding-top:18px">
      ${ui.notice && S.phase === 'results' ? `<div class="banner">${esc(ui.notice)}</div>` : ''}
      <div class="scores"><div class="sc"><div class="l">${scope === 'all' ? 'Overall' : esc(M.sessions[scope].name)}</div><div class="v ${overall >= PASS ? 'good' : 'bad'}">${overall}%</div><div class="l">${right} / ${tot} correct &middot; ${PASS}% reference</div></div>${scope === 'all' ? sessCards : ''}</div>
      <h2>By topic</h2><div class="card" style="padding:8px 14px;overflow-x:auto"><table class="simple"><tr><th>Topic</th><th class="n">Correct</th><th class="n">%</th><th>0% &mdash; 100% (line = ${PASS}%)</th></tr>${trows}</table></div>
      <h2>Share with your tutor</h2>
      <div class="acts"><button class="btn primary" data-act="copy">Copy results code</button>
      <button class="btn" data-act="showcode">${ui.showCode ? 'Hide' : 'Show'} code</button></div>
      ${ui.showCode ? `<textarea class="code" readonly id="code">${esc(resultsCode(scope))}</textarea>` : ''}
      <h2>Questions</h2>
      <div class="filters" style="margin:0 0 6px"><button class="chip${f === 'all' ? ' on' : ''}" data-act="rfilter" data-f="all">All (${tot})</button>
        <button class="chip${f === 'wrong' ? ' on' : ''}" data-act="rfilter" data-f="wrong">Wrong only (${nWrong})</button>
        <button class="chip${f === 'flag' ? ' on' : ''}" data-act="rfilter" data-f="flag">Flagged (${nFlag})</button>
        <button class="chip" data-act="expand">${ui.expand ? 'Collapse all' : 'Expand all'}</button></div>
      <div class="qlist">${items || '<div class="card muted">Nothing to show for this filter.</div>'}</div>
      <p class="muted" style="margin-top:20px">Total time on questions: ${clock(time)}.
      ${S.phase === 'results' ? ` <button class="btn sm" data-act="reset-ask" data-id="${esc(ID)}" data-title="${esc(M.title)}">Reset this mock</button>` : ''}</p>
    </div>`;
}

/* ---------- timer ---------- */
function updateTimer() {
  const now = Date.now();
  if (S && S.phase === 'run') {
    const el = document.getElementById('tm');
    if (el) el.textContent = clock(ui.clockMode === 'exam' ? examLeftSec(now) : (S.ses[S.si].end - now) / 1000);
    const al = document.getElementById('talert');
    if (al) { if (ui.alertUntil > now) { al.textContent = ui.alertText; al.hidden = false; } else al.hidden = true; }
  } else if (S && S.phase === 'break') {
    const el = document.getElementById('brk');
    if (el) {
      const left = (S.breakEnd - now) / 1000;
      el.textContent = clock(left);
      el.className = 'bigclock' + (left <= 300 ? ' low' : '');
    }
  }
}
function checkAlerts(now) {
  const left = (S.ses[S.si].end - now) / 1000;
  for (const th of [1800, 900, 300]) {
    const key = S.si + ':' + th;
    if (left <= th && left > th - 30 && !ui.al[key] && M.sessions[S.si].minutes * 60 > th) {
      ui.al[key] = 1; ui.alertText = (th / 60) + ' minutes remaining'; ui.alertUntil = now + 15000;
    }
  }
}
function tick() {
  const now = Date.now(), dt = now - lastTick; lastTick = now;
  if (!M || !S) return;
  if (S.phase === 'run') {
    if (now >= S.ses[S.si].end) { endSession(S.si, true); return; }
    if (dt < 2500 && ui.scope === null) qst(curQ().id).t += dt / 1000;
    checkAlerts(now); updateTimer(); save(false);
  } else if (S.phase === 'break') {
    if (now >= S.breakEnd) { startSession(S.si, S.breakEnd); ui.notice = null; advance(); render(); return; }
    updateTimer();
  }
}

/* ---------- events ---------- */
root.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'mclose') { if (t.classList.contains('mback') && e.target !== t) return; ui.modal = null; render(); return; }
  if (act === 'pick') {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim()) return; // finishing a text selection, not choosing
    pick(t.dataset.k); return;
  }
  const A = {
    strike: () => strike(t.dataset.k),
    hl: highlight, hlclear: clearHighlights, flag,
    zin: () => zoom(1), zout: () => zoom(-1),
    prev: () => go(S.cur[S.si] - 1), next: () => go(S.cur[S.si] + 1),
    nav: () => { ui.modal = { type: 'nav' }; render(); },
    goto: () => { if (!ui.reviewLock) ui.review = false; go(+t.dataset.i); },
    clock: () => { ui.clockMode = ui.clockMode === 'exam' ? 'sec' : 'exam'; render(); },
    review: () => { ui.review = !ui.review; ui.prefsOpen = false; render(); },
    'rv-close': () => { ui.review = false; ui.reviewLock = false; render(); },
    'rv-lock': () => { ui.reviewLock = !ui.reviewLock; render(); },
    'rv-f': () => { ui.rv[t.dataset.f] = t.checked ? 1 : 0; render(); },
    'rv-clear': () => { ui.rv = { un: 0, att: 0, fl: 0 }; render(); },
    prefs: () => { ui.prefsOpen = !ui.prefsOpen; ui.review = false; ui.schemeTmp = prefs.scheme || 0; render(); },
    'pf-pick': () => { ui.schemeTmp = +t.dataset.n; render(); },
    'pf-ok': () => { prefs.scheme = ui.schemeTmp; savePrefs(); ui.prefsOpen = false; render(); },
    'pf-cancel': () => { ui.prefsOpen = false; render(); },
    help: () => { ui.modal = { type: 'help' }; render(); },
    side: () => { ui.side = !ui.side; render(); },
    filter: () => { ui.filter = t.dataset.f; render(); },
    'end-ask': () => { ui.modal = { type: 'end' }; render(); },
    'end-do': () => endSession(S.si, false),
    timer: () => { prefs.hideTimer = !prefs.hideTimer; savePrefs(); render(); },
    begin: () => { startSession(0); ui.notice = null; render(); },
    startnext: () => { startSession(S.si); ui.notice = null; render(); },
    score: () => { ui.scope = +t.dataset.si; window.scrollTo(0, 0); render(); },
    backbreak: () => { ui.scope = null; render(); },
    rfilter: () => { ui.rfilter = t.dataset.f; render(); },
    expand: () => { ui.expand = !ui.expand; render(); },
    showcode: () => { ui.showCode = !ui.showCode; render(); },
    copy: () => copyText(resultsCode(ui.scope === null ? 'all' : ui.scope)).then(ok => toast(ok ? 'Results code copied' : 'Copy failed: use Show code')),
    'reset-ask': () => { ui.modal = { type: 'reset', id: t.dataset.id, title: t.dataset.title }; render(); },
    'reset-do': () => {
      try { localStorage.removeItem(KEY(t.dataset.id)); } catch (er) {}
      ui.modal = null; ui.scope = null; ui.notice = null; ui.showCode = false;
      if (M && t.dataset.id === ID) S = freshState(M);
      render(); toast('Mock reset');
    }
  };
  if (A[act]) A[act]();
});
root.addEventListener('contextmenu', e => {
  const o = e.target.closest('.orow');
  if (!o || view() !== 'exam') return;
  e.preventDefault(); strike(o.querySelector('.obox').dataset.k);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input,textarea,select')) return;
  if (e.key === 'Escape' && (ui.modal || ui.review || ui.prefsOpen)) { ui.modal = null; ui.review = false; ui.prefsOpen = false; render(); return; }
  if (ui.modal || ui.prefsOpen || view() !== 'exam') return;
  const q = curQ(), k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('obox')) { e.preventDefault(); pick(e.target.dataset.k); return; }
  if (k in q.options) { pick(k); return; }
  if (k === 'ArrowLeft') { e.preventDefault(); go(S.cur[S.si] - 1); }
  else if (k === 'ArrowRight') { e.preventDefault(); go(S.cur[S.si] + 1); }
  else if (k === 'F') flag();
  else if (k === 'H') highlight();
});
document.addEventListener('mouseup', e => { if (hlFloatEl && hlFloatEl.contains(e.target)) return; setTimeout(() => hlAfterMouseUp(e), 0); });
document.addEventListener('mousedown', e => { if (hlFloatEl && !hlFloatEl.contains(e.target)) removeFloat(); });
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); save(true); });
window.addEventListener('pagehide', () => save(true));
window.addEventListener('beforeunload', () => save(true));

/* ---------- boot ---------- */
async function getJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(url + ' returned ' + r.status);
  return r.json();
}
function validate(m) {
  if (!m || !Array.isArray(m.sessions) || !m.sessions.length) throw new Error('Mock file has no sessions.');
  m.sessions.forEach(s => {
    if (!Array.isArray(s.questions) || !s.questions.length) throw new Error('A session has no questions.');
    s.questions.forEach(q => { if (!q.id || !q.options || !q.answer) throw new Error('Question ' + (q.id || '?') + ' is incomplete.'); });
  });
}
async function boot() {
  zoom(0);
  document.documentElement.style.setProperty('--qfs', ZOOMS[prefs.zoom] + 'px');
  if (!ID) {
    try { const l = await getJSON('mocks.json'); mockList = Array.isArray(l) ? l : (l.mocks || []); }
    catch (e) { fatal = 'Could not load mocks.json (' + e.message + ').'; }
    render(); return;
  }
  if (!/^[\w-]+$/.test(ID)) { fatal = 'Invalid mock id.'; render(); return; }
  render();
  try {
    M = await getJSON(ID + '.json');
    validate(M);
    S = loadState(ID, M);
    advance();
    save(true);
  } catch (e) { M = null; fatal = 'Could not load mock "' + ID + '": ' + e.message; }
  render();
  setInterval(tick, 250);
}
boot();
})();
</script>
</body>
