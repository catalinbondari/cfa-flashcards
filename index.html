<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="499 CFA Level I flashcards built from handwritten revision notes.">
<meta name="theme-color" content="#f6f4ef">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CFA Gap Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, card centred, controls pinned under it. Biro-on-paper palette. */
:root{
  --paper:#f6f4ef; --surface:#fff; --raised:#fbfaf7;
  --ink:#1b1a18; --ink-soft:#5e5b55; --ink-faint:#8b8781;
  --rule:#e3dfd6; --rule-soft:#eeebe4;
  --accent:#1f4ea8; --accent-soft:#e9eefc;
  --miss:#b02530; --miss-soft:#fbeaeb;
  --hit:#1d6b49; --hit-soft:#e4f1ea;
  --fs:'Archivo',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --fh:'Caveat','Bradley Hand','Segoe Script',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131519; --surface:#1b1e24; --raised:#21252c;
  --ink:#e9e7e2; --ink-soft:#9d9a92; --ink-faint:#74716b;
  --rule:#2b2f37; --rule-soft:#23272e;
  --accent:#86a9ec; --accent-soft:#1d2840;
  --miss:#e9797f; --miss-soft:#361e21;
  --hit:#6fc79d; --hit-soft:#1a2f26;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#131519; --surface:#1b1e24; --raised:#21252c;
  --ink:#e9e7e2; --ink-soft:#9d9a92; --ink-faint:#74716b;
  --rule:#2b2f37; --rule-soft:#23272e;
  --accent:#86a9ec; --accent-soft:#1d2840;
  --miss:#e9797f; --miss-soft:#361e21;
  --hit:#6fc79d; --hit-soft:#1a2f26;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--fs);margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px;min-height:100%}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--ink-faint);font-family:var(--fm);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s ease}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;font-family:var(--fs);font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-f{border-style:dashed}
.chip b{font-weight:400;opacity:.65;font-family:var(--fm);font-size:11px;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:28px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:16px;cursor:pointer;position:relative;text-align:left}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tag{position:absolute;top:14px;left:20px;font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-family:var(--fs)}
.starred{position:absolute;top:12px;right:16px;font-size:11px;color:var(--miss);font-family:var(--fm)}
.term{font-size:23px;font-weight:600;line-height:1.3;letter-spacing:-.015em;text-wrap:balance;margin:0}
.hint{font-size:12px;color:var(--ink-faint);font-family:var(--fm);margin:0}
.defn{font-size:16.5px;line-height:1.6;color:var(--ink);font-family:var(--fm);margin:0;border-top:1px solid var(--rule-soft);padding-top:16px;overflow-wrap:break-word}
.mth{font-family:var(--fh);font-size:1.62em;line-height:1.3;display:inline-block;font-weight:600;letter-spacing:.01em}
.mth sup{font-size:.62em;vertical-align:super;line-height:0}
.mth sub{font-size:.62em;vertical-align:sub;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .16em}
.fn{border-bottom:1.6px solid currentColor;padding:0 .3em .05em}
.fd{padding:.07em .3em 0}
.sq{display:inline-flex;align-items:flex-start}
.sqb{border-top:1.6px solid currentColor;padding:.1em .16em 0;margin-left:-.04em}
.tx{font-family:var(--fh)}
.ac{white-space:nowrap}
.br{font-size:1.08em}
.qd{display:inline-block;width:1.1em}
.note sub,.lg sub,.defn sub{font-size:.7em;vertical-align:sub;line-height:0}
.note sup,.lg sup,.defn sup{font-size:.7em;vertical-align:super;line-height:0}
.note{font-size:13.5px;line-height:1.6;color:var(--ink-soft);font-family:var(--fs);margin:10px 0 0}
.legend{margin:14px 0 0;padding-top:11px;border-top:1px dashed var(--rule);display:flex;flex-direction:column;gap:5px}
.lg{font-family:var(--fs);font-size:13px;line-height:1.45;color:var(--ink-soft)}
.lg b{font-family:var(--fh);font-size:17px;font-weight:600;color:var(--accent);margin-right:7px}
.lgh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);font-family:var(--fs);margin-bottom:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{font-family:var(--fs);font-size:15px;font-weight:500;padding:14px 10px;border-radius:11px;border:1px solid;cursor:pointer;background:var(--surface)}
.acts button:disabled{opacity:.32;cursor:default}
#miss{color:var(--miss);border-color:var(--miss)}
#miss:not(:disabled):hover{background:var(--miss-soft)}
#hit{color:var(--hit);border-color:var(--hit)}
#hit:not(:disabled):hover{background:var(--hit-soft)}
.flipbtn{font-family:var(--fs);font-size:15px;font-weight:500;padding:14px;border-radius:11px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;width:100%}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--rule-soft);padding-top:14px}
.tally{font-family:var(--fm);font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;display:flex;gap:14px}
.tally .h{color:var(--hit)} .tally .m{color:var(--miss)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.mini button{font-family:var(--fs);font-size:12.5px;font-weight:500;padding:7px 11px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);cursor:pointer}
.mini button:hover{border-color:var(--ink-faint)}
.pvhead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
.pvhead h2{margin:0;font-size:17px;font-weight:600}
.pvhead button{font-family:var(--fs);font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.pe{break-inside:avoid;page-break-inside:avoid;margin-bottom:12px}
.ph{display:flex;gap:9px;align-items:baseline;margin-bottom:5px}
.pn{font-family:var(--fm);font-size:10.5px;color:var(--ink-faint);min-width:30px;font-variant-numeric:tabular-nums}
.pt{font-size:14px;font-weight:600;line-height:1.25}
.pl{border-bottom:1px solid var(--rule);height:19px;margin-left:39px}
@media print{
  @page{size:A4;margin:14mm 13mm}
  body.printing{background:#fff;color:#111}
  body.printing header,body.printing .bar,body.printing .chips,body.printing #stage,
  body.printing #done,body.printing .foot,body.printing .kbd,body.printing .undorow,
  body.printing .pvhead{display:none!important}
  body.printing .wrap{max-width:none;padding:0}
  body.printing .pt{color:#111}
  body.printing .pn{color:#777}
  body.printing .pl{border-color:#ccc;height:17px}
  body.printing .pe{margin-bottom:11px}
}
.mini button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.done{background:var(--raised);border:1px solid var(--rule);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.done h2{margin:0;font-size:19px;font-weight:600}
.done p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-soft)}
.score{font-family:var(--fm);font-size:34px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums}
.misslist{font-family:var(--fm);font-size:12.5px;line-height:1.75;color:var(--ink-soft);max-height:220px;overflow-y:auto;border-top:1px solid var(--rule-soft);padding-top:12px;margin:0;padding-left:18px}
.undorow{display:flex;justify-content:center}
.undorow button{font-family:var(--fs);font-size:13px;font-weight:500;padding:9px 16px;border-radius:9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink-soft);cursor:pointer}
.undorow button:hover{border-color:var(--accent);color:var(--accent)}
.kbd{font-size:11.5px;color:var(--ink-faint);font-family:var(--fm);text-align:center;margin:0}
#savednote{margin-top:4px}
@media (max-width:420px){.term{font-size:20px}.defn{font-size:15px}.kbd{display:none}#savednote{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>CFA gap deck</h1>
    <span class="sub" id="pos">—</span>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <div class="chips" id="chips"></div>

  <div id="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, activate to reveal the answer">
      <span class="tag" id="tag"></span>
      <span class="starred" id="star" hidden>missed before</span>
      <p class="term" id="term"></p>
      <p class="hint" id="hint">tap to reveal</p>
      <p class="defn" id="defn" hidden></p>
      <p class="note" id="note" hidden></p>
      <div class="legend" id="legend" hidden></div>
    </div>
    <div style="height:10px"></div>
    <button class="flipbtn" id="flip">Reveal answer</button>
    <div class="acts" id="acts" hidden>
      <button id="miss">Missed it</button>
      <button id="hit">Got it</button>
    </div>
  </div>

  <div class="done" id="done" hidden>
    <h2 id="doneh">Round complete</h2>
    <div class="score" id="score"></div>
    <p id="donep"></p>
    <ul class="misslist" id="misslist"></ul>
    <div class="mini">
      <button id="again">Start again</button>
      <button id="revmiss">Review missed</button>
    </div>
  </div>

  <div id="printview" hidden>
    <div class="pvhead">
      <h2 id="pvtitle"></h2>
      <button id="pvback">Back to cards</button>
    </div>
    <div id="pvrows"></div>
  </div>

  <div class="undorow" id="undorow" hidden>
    <button id="undo">Undo last answer</button>
  </div>

  <div class="foot">
    <div class="tally"><span class="h" id="th">0 got</span><span class="m" id="tm">0 missed</span></div>
    <div class="mini">
      <button id="shuf" class="on">Shuffle</button>
      <button id="onlymiss">Missed only</button>
      <button id="reset">Reset</button>
      <button id="printbtn">Print this list</button>
    </div>
  </div>
  <p class="kbd" id="savednote">progress saved on this device</p>
  <p class="kbd">space flip · ← missed · → got it · z undo</p>
</div>

et value; pref = preferred stock; EBITDA = earnings before interest, taxes, depreciation and amortisation; FCF = free cash flow"}, {"t": "Div growth rate", "d": "(1 - Payout) × ROE", "c": "equity", "f": 1, "m": "(1 - \\text{Payout}) \\times \\text{ROE}", "w": "ROE = return on equity"}, {"t": "Equity from EV", "d": "EV - debt - preferred + cash", "c": "equity", "f": 1, "m": "\\text{EV} - \\text{debt} - \\text{preferred} + \\text{cash}", "w": "EV = enterprise value"}, {"t": "Value of a perpetual pref stock", "d": "Dividend / required rate. They never grow (like bonds)", "c": "equity", "f": 1, "m": "\\frac{\\text{Dividend}}{\\text{required Rate}}", "note": "they never grow (like bonds)"}, {"t": "ROE", "d": "Return on assets × Fin leverage", "c": "equity", "f": 1, "m": "\\text{Return on assets} \\times \\text{Fin leverage}", "w": "ROE = return on equity; Fin leverage = assets over equity"}, {"t": "EV/EBITDA", "d": "most useful when comparing companies with significant differences in cap structures", "c": "equity"}, {"t": "Justified Forward P/E", "d": "Payout ratio / (RR - g)", "c": "equity", "f": 1, "m": "\\frac{\\text{Payout Ratio}}{\\text{RR} - g}", "w": "RR = required return; g = constant growth rate"}, {"t": "Present value models", "d": "Fundamental tenet - individuals invest for the expected future benefit", "c": "equity"}, {"t": "Dividend chronology", "d": "Declaration → ex-date → Record → payment (payment can happen on a weekend)", "c": "equity"}, {"t": "Ex date", "d": "first day the share trades without the dividend attached", "c": "equity"}, {"t": "Technical analyst", "d": "bets the market is inefficient at their own level. Fundamental - semi-STRONG, insider - STRONG", "c": "equity"}, {"t": "Value stock", "d": "cheap relative to fundamentals, high div yield, low P/E", "c": "equity"}, {"t": "Growth stock", "d": "expensive, low div yield, high P/E", "c": "equity"}, {"t": "Efficient market hypothesis", "d": "only that the market is rational", "c": "equity"}, {"t": "Disposition effect", "d": "investors tend to avoid realizing losses", "c": "equity"}, {"t": "Momentum anomaly", "d": "securities that have experienced high returns continue to receive higher returns", "c": "equity"}, {"t": "Efficient", "d": "price already knows", "c": "equity"}, {"t": "Inefficient", "d": "price hasn't caught up", "c": "equity"}, {"t": "HHI", "d": "Σ Si² — Si = each firm's market share", "c": "econ", "f": 1, "m": "\\sum S_{i}^{2}", "note": "Si = each firm's market share", "w": "HHI = Herfindahl-Hirschman Index; Si = market share of firm i"}, {"t": "Float adjusted", "d": "shares the public can actually buy", "c": "equity"}, {"t": "Fundamental weighting", "d": "value tilt, contrarian, needs rebalancing, higher cost", "c": "equity"}, {"t": "Cap-weighted", "d": "momentum tilt, no rebalancing needed, low cost", "c": "equity"}, {"t": "Equal weighted", "d": "small cap tilt, needs the most rebalancing of all", "c": "equity"}, {"t": "Style index", "d": "market cap, value, growth", "c": "equity"}, {"t": "Aggregate Fixed income index", "d": "single broad benchmark covering an entire investment-grade bond market", "c": "equity"}, {"t": "Commodity indexes", "d": "hold futures (metal, energy, agriculture, livestock)", "c": "equity"}, {"t": "Real estate index", "d": "Appraisal index, repeat sales index, REIT index", "c": "equity"}, {"t": "Hedge fund index", "d": "they choose what to report (self selection bias)", "c": "equity"}, {"t": "FI vs equity indexes", "d": "FI harder, more expensive (dealer prices)", "c": "equity"}, {"t": "Preference shares", "d": "no vote, fixed dividend, behaves like a bond, higher yield than bonds (tax efficient in US)", "c": "equity"}, {"t": "Participating pref", "d": "if it hits a target gets paid extra", "c": "equity"}, {"t": "Depository receipts", "d": "cert issued by a depository bank representing shares of a foreign company trading on a local exchange in local currency", "c": "equity"}, {"t": "ADR levels", "d": "Level I OTC, Level II US exchanges, Level III Public offering", "c": "equity"}, {"t": "Book value", "d": "total assets - total liabilities", "c": "equity", "f": 1, "m": "\\text{total assets} - \\text{total liabilities}"}, {"t": "ROE (book value based)", "d": "NIt / BVEt-1", "c": "equity", "f": 1, "m": "\\frac{\\text{NI}_{t}}{\\text{BVE}_{t-1}}", "w": "NIt = net income in year t; BVEt-1 = book value of equity at the start of the year"}, {"t": "More difficult to estimate", "d": "cost of equity", "c": "equity"}, {"t": "Cumulative voting", "d": "allows shareholders to direct their total voting rights to specific candidates", "c": "equity"}, {"t": "Voting by proxy", "d": "allowing a designated party to vote on your behalf", "c": "equity"}, {"t": "Participating pref shares", "d": "additional dividend if company exceeds a certain level of profit. Additional distribution of company's assets upon liquidation (venture capital, private equity)", "c": "equity"}, {"t": "Putable shares", "d": "less return as they are less risky, less volatile. Rise in common → convert and benefit", "c": "equity"}, {"t": "Management", "d": "can influence book value", "c": "equity"}]</script>
<script>
(function(){
var SYM={times:'×',div:'÷',pm:'±',cdot:'·',sum:'Σ',approx:'≈',
geq:'≥',leq:'≤',to:'→',neq:'≠',infty:'∞',ldots:'…',
alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',varepsilon:'ε',
epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',
sigma:'σ',Sigma:'Σ',tau:'τ',phi:'φ',chi:'χ',omega:'ω',Omega:'Ω'};
var ACC={bar:'̄',hat:'̂',tilde:'̃',vec:'⃗',dot:'̇'};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

var PAIRS=['RFp','RFb','Rf','Rm','Ri','Rd','Re','Ro','Rp','Rb','RL','Rt','Cu','Cd','Su','Sd',
'Vu','VL','Vc','Vb','Wd','Wp','We','wd','wp','we','ai','ei','Dt','Dn','Pn','St','Sx','Si',
'xi','yi','Yi','Xi','PA','PB','wA','wB','NIt','Cov','ERp'];
function symFmt(raw){
  var s=esc(raw);
  s=s.replace(/\bPV([-+])/g,'PV<sub>$1</sub>');
  s=s.replace(/\bBVEt-1\b/g,'BVE<sub>t-1</sub>');
  s=s.replace(/\bf1m,1m\b/g,'f<sub>1m,1m</sub>');
  s=s.replace(/\bs²p\b/g,'s<sup>2</sup><sub>p</sub>');
  s=s.replace(/\bNIt\b/g,'NI<sub>t</sub>');
  PAIRS.forEach(function(p){
    if(p==='Cov'||p==='NIt') return;
    s=s.replace(new RegExp('\\b'+p+'\\b','g'), p.length===3? p.slice(0,2)+'<sub>'+p.slice(2)+'</sub>' : p[0]+'<sub>'+p.slice(1)+'</sub>');
  });
  s=s.replace(/([A-Za-zΔσρβμπχ̄²])([0-9]+(?:,[0-9]+)*)(?![0-9A-Za-z])/g,'$1<sub>$2</sub>');
  s=s.replace(/([σβ])([a-zA-Z])(?![a-zA-Z])/g,'$1<sub>$2</sub>');
  return s;
}
function mathHTML(src){
  var i=0,s=src;
  function grp(){
    while(s[i]===' ')i++;
    if(s[i]==='{'){var d=1,st=++i;while(i<s.length&&d>0){if(s[i]==='{')d++;else if(s[i]==='}')d--;if(d>0)i++}var inner=s.slice(st,i);i++;return walk(inner)}
    if(s[i]==='\\'){var st2=i;i++;while(i<s.length&&/[a-zA-Z]/.test(s[i]))i++;return walk(s.slice(st2,i))}
    return esc(s[i++]||'');
  }
  function walk(str){
    var save=[s,i]; s=str; i=0; var o='';
    while(i<s.length){
      var ch=s[i];
      if(ch==='\\'){
        var st=++i; while(i<s.length&&/[a-zA-Z]/.test(s[i]))i++;
        var cmd=s.slice(st,i);
        if(cmd==='frac'||cmd==='tfrac'||cmd==='dfrac'){var a=grp(),b=grp();
          o+='<span class="fr"><span class="fn">'+a+'</span><span class="fd">'+b+'</span></span>';}
        else if(cmd==='sqrt'){o+='<span class="sq">√<span class="sqb">'+grp()+'</span></span>';}
        else if(cmd==='text'||cmd==='mathrm'||cmd==='operatorname'){o+='<span class="tx">'+grp()+'</span>';}
        else if(ACC[cmd]){o+='<span class="ac">'+grp()+ACC[cmd]+'</span>';}
        else if(cmd==='left'||cmd==='right'){var nx=s[i];if(nx&&nx!=='.'){o+='<span class="br">'+esc(nx)+'</span>';i++;}else if(nx==='.')i++;}
        else if(cmd==='quad'){o+='<span class="qd"></span>';}
        else if(cmd==='qquad'){o+='<span class="qd"></span><span class="qd"></span>';}
        else if(cmd===''){o+=esc(s[i]||'');i++;}
        else if(SYM[cmd]){o+=SYM[cmd];}
        else {o+=esc(cmd);}
      }
      else if(ch==='^'){i++;o+='<sup>'+grp()+'</sup>';}
      else if(ch==='_'){i++;o+='<sub>'+grp()+'</sub>';}
      else if(ch==='{'){var d2=1,st3=++i;while(i<s.length&&d2>0){if(s[i]==='{')d2++;else if(s[i]==='}')d2--;if(d2>0)i++}o+=walk(s.slice(st3,i));i++;}
      else if(ch==='$'||ch==='}'){i++;}
      else if(ch===' '){o+=' ';i++;}
      else {o+=esc(ch);i++;}
    }
    s=save[0];i=save[1];return o;
  }
  return '<span class="mth">'+walk(src)+'</span>';
}
var CARDS = JSON.parse(document.getElementById('data').textContent);
var NAMES = {quant:'Quant',econ:'Economics',fsa:'Financial statements',corp:'Corporate issuers',equity:'Equity',fi:'Fixed income',deriv:'Derivatives',alts:'Alternatives',pm:'Portfolio mgmt',ethics:'Ethics'};
var KEY='cfa-gap-deck-v1';
var S={topic:'all',missed:{},shuffle:false,onlyMissed:false};
var saved=null;
try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw);
  S.missed=p.missed||{}; S.topic=p.topic||'all'; S.shuffle=!!p.shuffle; S.onlyMissed=!!p.onlyMissed;
  if(p.n===CARDS.length && p.order && p.order.length) saved=p;
}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({
  missed:S.missed, topic:S.topic, shuffle:S.shuffle, onlyMissed:S.onlyMissed,
  n:CARDS.length,
  order:deck.map(function(c){return c._i}),
  i:i, hits:hits, misses:misses,
  rm:roundMissed.map(function(c){return c._i}),
  hist:hist
}))}catch(e){}}

var deck=[],i=0,flipped=false,hits=0,misses=0,roundMissed=[],hist=[];
var el=function(id){return document.getElementById(id)};

function pool(){
  var a=CARDS.map(function(c,n){c._i=n;return c});
  if(S.topic==='formula') a=a.filter(function(c){return c.f});
  else if(S.topic!=='all') a=a.filter(function(c){return c.c===S.topic});
  if(S.onlyMissed) a=a.filter(function(c){return S.missed[c._i]});
  return a;
}
function byIdx(n){var c=CARDS[n]; c._i=n; return c}
function build(resume){
  if(resume && saved){
    deck=saved.order.map(byIdx);
    i=saved.i||0; hits=saved.hits||0; misses=saved.misses||0;
    roundMissed=(saved.rm||[]).map(byIdx); hist=saved.hist||[];
    saved=null;
  } else {
    deck=pool();
    if(S.shuffle) for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}
    i=0;hits=0;misses=0;roundMissed=[];hist=[];
  }
  el('done').hidden=true; el('stage').hidden=false;
  save(); render();
}
function chips(){
  var counts={all:CARDS.length,formula:0};
  CARDS.forEach(function(c){counts[c.c]=(counts[c.c]||0)+1; if(c.f) counts.formula++;});
  var box=el('chips'); box.textContent='';
  var keys=['all','formula'].concat(Object.keys(NAMES));
  keys.forEach(function(k){
    var b=document.createElement('button');
    b.className='chip'; b.setAttribute('aria-pressed', S.topic===k?'true':'false');
    b.innerHTML=(k==='all'?'All':k==='formula'?'Formulas':NAMES[k])+' <b>'+(counts[k]||0)+'</b>';
    if(k==='formula') b.classList.add('chip-f');
    b.onclick=function(){S.topic=k;save();chips();build()};
    box.appendChild(b);
  });
}
function render(){
  var n=deck.length;
  el('th').textContent=hits+' got'; el('tm').textContent=misses+' missed';
  el('undorow').hidden=!hist.length;
  if(!n){ el('stage').hidden=true; el('done').hidden=false; el('undorow').hidden=true; el('doneh').textContent='Nothing here';
    el('score').textContent='0'; el('donep').textContent=S.onlyMissed?'No missed cards in this selection yet. Turn off “Missed only” to start a round.':'No cards in this topic.';
    el('misslist').textContent=''; return; }
  if(i>=n){ finish(); return; }
  var c=deck[i];
  el('pos').textContent=(i+1)+' / '+n;
  el('prog').style.width=(i/n*100)+'%';
  el('tag').textContent=NAMES[c.c]||c.c;
  el('star').hidden=!S.missed[c._i];
  el('term').textContent=c.t;
  if(c.m){ el('defn').innerHTML=mathHTML(c.m); } else { el('defn').innerHTML=symFmt(c.d); }
  if(c.note){ el('note').innerHTML=symFmt(c.note); } else { el('note').textContent=''; }
  var lg=el('legend'); lg.textContent='';
  if(c.w){
    var hd=document.createElement('div'); hd.className='lgh'; hd.textContent='where'; lg.appendChild(hd);
    c.w.split(';').forEach(function(p){
      p=p.trim(); if(!p) return;
      var k=p.indexOf('=');
      var row=document.createElement('div'); row.className='lg';
      var b=document.createElement('b'); b.innerHTML=symFmt(k>-1?p.slice(0,k).trim():p);
      row.appendChild(b);
      if(k>-1){var v=document.createElement('span'); v.innerHTML=symFmt(p.slice(k+1).trim()); row.appendChild(v);}
      lg.appendChild(row);
    });
  }
  flipped=false;
  el('defn').hidden=true; el('note').hidden=true; el('legend').hidden=true;
  el('hint').hidden=false;
  el('acts').hidden=true; el('flip').hidden=false;
}
function flip(){
  if(flipped||i>=deck.length) return;
  flipped=true;
  var c=deck[i];
  el('defn').hidden=false; el('hint').hidden=true;
  el('note').hidden=!c.note;
  el('legend').hidden=!c.w;
  el('flip').hidden=true; el('acts').hidden=false;
}
function mark(ok){
  if(!flipped||i>=deck.length) return;
  var c=deck[i];
  hist.push({at:i,ok:ok,wasMissed:!!S.missed[c._i]});
  if(ok){hits++; delete S.missed[c._i];}
  else {misses++; S.missed[c._i]=1; roundMissed.push(c);}
  save(); i++; render();
}
function printView(){
  var box=el('pvrows'); box.textContent='';
  deck.forEach(function(c,n){
    var e=document.createElement('div'); e.className='pe';
    var h=document.createElement('div'); h.className='ph';
    var a=document.createElement('span'); a.className='pn'; a.textContent=n+1;
    var b=document.createElement('span'); b.className='pt'; b.textContent=c.t;
    if(c.f){b.style.fontFamily='var(--fm)';b.style.fontWeight='500';b.style.fontSize='13px';}
    h.appendChild(a); h.appendChild(b); e.appendChild(h);
    for(var k=0;k<(c.f?3:2);k++){var l=document.createElement('div');l.className='pl';e.appendChild(l)}
    box.appendChild(e);
  });
  var lbl=S.topic==='all'?'All cards':S.topic==='formula'?'Formulas':(NAMES[S.topic]||S.topic);
  el('pvtitle').textContent=lbl+' — '+deck.length+' terms, in the order on screen';
  el('printview').hidden=false; el('stage').hidden=true; el('done').hidden=true; el('undorow').hidden=true;
  document.body.classList.add('printing');
  window.scrollTo(0,0);
}
function closePrint(){
  el('printview').hidden=true;
  document.body.classList.remove('printing');
  render();
}
function undo(){
  if(!hist.length) return;
  var h=hist.pop(), c=deck[h.at];
  if(h.ok) hits--; else { misses--; var k=roundMissed.lastIndexOf(c); if(k>-1) roundMissed.splice(k,1); }
  if(h.wasMissed) S.missed[c._i]=1; else delete S.missed[c._i];
  save();
  i=h.at;
  el('done').hidden=true; el('stage').hidden=false;
  render(); flip();
}
function finish(){
  el('stage').hidden=true; el('done').hidden=false; el('undorow').hidden=!hist.length;
  var tot=hits+misses, pct=tot?Math.round(hits/tot*100):0;
  el('prog').style.width='100%'; el('pos').textContent=tot+' / '+tot;
  el('doneh').textContent='Round complete';
  el('score').textContent=pct+'%';
  el('donep').textContent=hits+' right, '+misses+' wrong out of '+tot+'. The missed ones stay flagged until you get them right.';
  var ul=el('misslist'); ul.textContent='';
  roundMissed.forEach(function(c){var li=document.createElement('li');li.textContent=c.t;ul.appendChild(li)});
}
el('card').onclick=flip;
el('card').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
el('flip').onclick=flip;
el('hit').onclick=function(){mark(true)};
el('miss').onclick=function(){mark(false)};
el('undo').onclick=undo;
el('printbtn').onclick=printView;
el('pvback').onclick=closePrint;
el('again').onclick=function(){S.onlyMissed=false;el('onlymiss').classList.remove('on');build()};
el('revmiss').onclick=function(){S.onlyMissed=true;el('onlymiss').classList.add('on');build()};
el('onlymiss').onclick=function(){S.onlyMissed=!S.onlyMissed;this.classList.toggle('on',S.onlyMissed);build()};
el('shuf').onclick=function(){S.shuffle=!S.shuffle;this.classList.toggle('on',S.shuffle);save();build()};
el('reset').onclick=function(){S.missed={};S.onlyMissed=false;el('onlymiss').classList.remove('on');save();build()};
document.addEventListener('keydown',function(e){
  if(!el('printview').hidden) return;
  if(e.target.tagName==='BUTTON'&&e.key===' ') return;
  if(e.key===' '){e.preventDefault(); flipped?mark(true):flip();}
  else if(e.key==='ArrowRight'){mark(true)}
  else if(e.key==='ArrowLeft'){mark(false)}
  else if(e.key==='Backspace'||e.key==='z'||e.key==='Z'){e.preventDefault();undo()}
});
el('shuf').classList.toggle('on',S.shuffle);
chips(); build(true);
})();
</script>
